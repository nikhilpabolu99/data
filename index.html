<script>
  const owner = "nikhilpabolu99";
  const repo = "data";
  const branch = "main";
  const apiBase = `https://api.github.com/repos/${owner}/${repo}/contents`;

  const intro = document.getElementById("intro");
  const explorer = document.getElementById("explorer");
  const grid = document.getElementById("explorerGrid");
  const pathTitle = document.getElementById("pathTitle");

  // Track current path inside "movies"
  let currentPath = "";

  // Load folders & files
  async function loadFolders(path = "") {
    currentPath = path; // keep track
    const url = `${apiBase}/movies${path}?ref=${branch}`;
    const res = await fetch(url);
    if (!res.ok) return console.error("Error:", res.status);
    const data = await res.json();

    grid.innerHTML = ""; // clear

    // Decide depth
    const depth = path.split("/").filter(Boolean).length;
    // depth = 0 -> movies
    // depth = 1 -> movies/somefolder
    // depth = 2 -> movies/somefolder/someother  ✅ show JSONs here

    data.forEach(item => {
      // Show folders always
      if (item.type === "dir") {
        const div = document.createElement("div");
        div.className = "card folder";
        div.textContent = "📂 " + item.name;
        div.onclick = () => {
          pathTitle.textContent = "📂 " + item.path;
          loadFolders(path + "/" + item.name);
        };
        grid.appendChild(div);
      }

      // Show JSON files only at depth == 2
      if (item.type === "file" && item.name.endsWith(".json") && depth === 2) {
        const div = document.createElement("div");
        div.className = "card file";
        div.textContent = "📄 " + item.name;
        div.onclick = () => window.open(item.html_url, "_blank");
        grid.appendChild(div);
      }
    });
  }

  // When movies button clicked
  document.getElementById("moviesBtn").onclick = () => {
    intro.style.display = "none";
    explorer.style.display = "flex";
    pathTitle.textContent = "📂 movies";
    loadFolders("");
  };
</script>
