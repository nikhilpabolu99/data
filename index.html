<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MeherNolan</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📊 MeherNolan</h1>
      <p>Tracking Indian Films, Globally !</p>
    </div>
    <div>
        Latest Releases:
    </div>
    <div class="latest-releases" id="latestReleases"></div>
    <!-- File Explorer Section -->
    <div class="explorer-section" id="explorerSection">
      <h2>Everything about BoxOffice!</h2>
      <div id="explorer"></div>
    </div>

    <!-- JSON Viewer Section -->
    <div class="json-viewer-section" id="jsonViewerSection">
      <button class="explorer-button back-button" id="backButton">
        ← Back to Explorer
      </button>
    <div style="margin-bottom: 1em;">
      <label for="releaseDate">Select Date:</label>
      <input type="date" id="releaseDate" name="releaseDate" style="appearance: none; -webkit-appearance: none; background: url('https://cdn-icons-png.flaticon.com/512/747/747310.png') no-repeat right 10px center/24px 24px, white; padding-right: 40px; border: 1px solid #ccc; border-radius: 4px; height: 2.2em; font-size: 1em; cursor: pointer;" />
    </div>
      <div class="loading" id="loadingSection">
        <div class="loading-spinner"></div>
        <p>Loading JSON data...</p>
      </div>

      <div id="errorSection" style="display: none;"></div>

      <!-- Summary Display Section -->
      <div class="summary-display" id="summaryDisplay">
        <div class="summary-title">📊 Data Summary</div>
        <div class="summary-grid" id="summaryGrid"></div>
      </div>

      <div class="buttons-container" id="buttonsContainer">
        <h3>📋 Available Data Tables</h3>
        <div class="button-grid" id="buttonGrid"></div>
      </div>

      <div class="data-display" id="dataDisplay">
        <div class="data-header">
          <h3 class="data-title" id="dataTitle">Select a data table</h3>
          <div class="data-actions">
            <button class="download-btn" id="downloadTableBtn" style="display: none;">
              📥 Download Table
            </button>
            <span class="data-count" id="dataCount">0 records</span>
          </div>
        </div>

        <div class="filter-section" id="filterSection">
          <div class="filter-controls">
            <div class="filter-group">
              <label for="searchInput">🔍 Search</label>
              <input type="text" id="searchInput" class="filter-input" placeholder="Search in all columns..." />
            </div>
            <div class="filter-group">
              <label for="columnFilter">📋 Filter by Column</label>
              <select id="columnFilter" class="filter-input">
                <option value="">All Columns</option>
              </select>
            </div>
            <button class="clear-filters-btn" id="clearFiltersBtn">🗑️ Clear</button>
          </div>
        </div>

        <div class="table-container" id="tableContainer">
          <div class="table-watermark">@nikhilntr9</div>
          <div class="no-data" id="noData">
            Click on a data table button above to view its contents
          </div>
          <table id="dataTable" style="display: none;">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- html2canvas (kept the same) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- App JS -->
  <script src="app.js"></script>
</body>
</html>
