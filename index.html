<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub Repo Explorer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f7f9;
    }
    h2 {
      color: #333;
    }
    button {
      display: block;
      margin: 5px 0;
      padding: 10px 15px;
      border: none;
      background: #4CAF50;
      color: white;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
      width: fit-content;
      min-width: 180px;
      transition: background 0.3s;
    }
    button:hover {
      background: #45a049;
    }
    .folder {
      margin-left: 20px;
      padding-left: 10px;
      border-left: 2px solid #ddd;
    }
    .file {
      margin-left: 20px;
      background: #2196F3;
    }
    .file:hover {
      background: #1976D2;
    }
  </style>
</head>
<body>
  <h2>📂 GitHub Repo Explorer</h2>
  <div id="explorer"></div>

  <script>
    const owner = "nikhilpabolu99";
    const repo = "data";
    const branch = "main";
    const apiBase = `https://api.github.com/repos/${owner}/${repo}/contents`;

    async function loadFolders(path = "", containerId = "explorer", isRoot = false) {
      try {
        const url = `${apiBase}/${path}?ref=${branch}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`Failed to fetch ${url}`);
        const data = await res.json();

        const container = document.getElementById(containerId);

        data.forEach(item => {
          // ✅ Root: only show "movies"
          if (isRoot && item.type === "dir" && item.name !== "movies") return;

          // ✅ Show folders everywhere
          if (item.type === "dir") {
            const btn = document.createElement("button");
            btn.textContent = "📂 " + item.name;
            btn.onclick = () => {
              let subContainer = document.getElementById(item.path);
              if (!subContainer) {
                subContainer = document.createElement("div");
                subContainer.id = item.path;
                subContainer.classList.add("folder");
                container.appendChild(subContainer);
              }
              loadFolders(item.path, item.path, false);
            };
            container.appendChild(btn);
          }

          // ✅ Show .json files ONLY if inside movies/somefolder/someother
          if (item.type === "file" && item.name.endsWith(".json")) {
            const depth = path.split("/").length;
            if (path.startsWith("movies/") && depth === 3) {
              const btn = document.createElement("button");
              btn.textContent = "📄 " + item.name;
              btn.classList.add("file");
              btn.onclick = () => window.open(item.html_url, "_blank");
              container.appendChild(btn);
            }
          }
        });
      } catch (err) {
        console.error("Error loading folders:", err);
      }
    }

    // Start at root
    loadFolders("", "explorer", true);
  </script>
</body>
</html>
